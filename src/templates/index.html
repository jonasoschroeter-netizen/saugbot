<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saugbot - Sensor Test Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .status-bar {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .status-item {
            display: inline-block;
            margin-right: 20px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .status-online { background: #4CAF50; }
        .status-offline { background: #f44336; }
        
        .sensors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .sensor-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .sensor-card h3 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .distance-display {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }
        
        .distance-unit {
            font-size: 18px;
            color: #666;
        }
        
        .distance-error {
            color: #f44336;
            font-size: 24px;
        }
        
        .main-sensor {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-bottom: 20px;
        }
        
        .main-sensor h3 {
            color: white;
        }
        
        .main-distance {
            font-size: 72px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        
        .threshold-indicator {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
            font-size: 18px;
        }
        
        .threshold-indicator.warning {
            background: rgba(255,193,7,0.3);
        }
        
        .threshold-indicator.danger {
            background: rgba(244,67,54,0.3);
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .config-panel {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .slider-container {
            margin: 15px 0;
        }
        
        .slider-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        
        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }
        
        .slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }
        
        .config-panel h2 {
            color: #333;
            margin-bottom: 15px;
        }
        
        .config-item {
            margin-bottom: 15px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 500;
        }
        
        .config-item input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        .config-item input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5568d3;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .btn-primary {
            background: #4CAF50;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-primary:hover {
            background: #45a049;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 15px;
        }
        
        .auto-refresh input[type="checkbox"] {
            width: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 Saugbot - Sensor Test Interface</h1>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="status-indicator" id="connectionStatus"></span>
                <span id="connectionText">Verbindung prüfen...</span>
            </div>
            <div class="status-item">
                <span>Auto-Refresh: </span>
                <label class="auto-refresh">
                    <input type="checkbox" id="autoRefresh" checked>
                    <span>Aktiv</span>
                </label>
            </div>
        </div>
        
        <div id="errorMessage" class="error-message" style="display: none;"></div>
        
        <!-- Haupt-Sensor Anzeige (Links Vorne) -->
        <div class="sensor-card main-sensor">
            <h3>🔍 Links Vorne Sensor (Haupt-Sensor)</h3>
            <div class="distance-display main-distance" id="leftDistance">
                <span class="distance-error">--</span>
            </div>
            <div class="distance-unit">cm</div>
            <div class="threshold-indicator" id="thresholdIndicator">
                <span id="thresholdStatus">Schwellenwert: <span id="thresholdValue">15</span> cm</span>
            </div>
        </div>
        
        <div class="sensors-grid">
            <div class="sensor-card">
                <h3>Front Sensor</h3>
                <div class="distance-display" id="frontDistance">
                    <span class="distance-error">--</span>
                </div>
                <div class="distance-unit">cm</div>
            </div>
            
            <div class="sensor-card">
                <h3>Right Sensor</h3>
                <div class="distance-display" id="rightDistance">
                    <span class="distance-error">--</span>
                </div>
                <div class="distance-unit">cm</div>
            </div>
        </div>
        
        <div class="config-panel">
            <h2>⚙️ Konfiguration</h2>
            
            <div class="slider-container">
                <div class="slider-label">
                    <label><strong>Schwellenwert für Links Vorne Sensor (cm):</strong></label>
                    <span id="thresholdDisplay">15</span>
                </div>
                <input type="range" id="thresholdSlider" class="slider" min="5" max="50" value="15" step="1" oninput="updateThresholdDisplay(this.value)">
                <div style="display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-top: 5px;">
                    <span>5 cm</span>
                    <span>50 cm</span>
                </div>
            </div>
            
            <div class="config-item">
                <label>Kollisions-Distanz (cm):</label>
                <input type="number" id="collisionDistance" min="5" max="100" step="1">
            </div>
            <div class="config-item">
                <label>Minimale Distanz (cm):</label>
                <input type="number" id="minDistance" min="5" max="50" step="1">
            </div>
            <button class="btn-primary" onclick="updateConfig()">Konfiguration speichern</button>
        </div>
    </div>
    
    <script>
        let autoRefreshInterval = null;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkSensorStatus();
            loadConfig();
            startAutoRefresh();
            
            document.getElementById('autoRefresh').addEventListener('change', function() {
                if (this.checked) {
                    startAutoRefresh();
                } else {
                    stopAutoRefresh();
                }
            });
        });
        
        function checkSensorStatus() {
            fetch('/api/sensors/status')
                .then(response => response.json())
                .then(data => {
                    const statusIndicator = document.getElementById('connectionStatus');
                    const statusText = document.getElementById('connectionText');
                    
                    if (data.available) {
                        statusIndicator.className = 'status-indicator status-online';
                        statusText.textContent = 'Sensoren verbunden';
                        readSensors();
                    } else {
                        statusIndicator.className = 'status-indicator status-offline';
                        statusText.textContent = 'Sensoren nicht verfügbar: ' + (data.error || 'Hardware nicht angeschlossen');
                        showError(data.error || 'Sensoren nicht verfügbar');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Verbindungsfehler: ' + error.message);
                });
        }
        
        function readSensors() {
            fetch('/api/sensors/read')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateDistance('front', data.distances.front);
                        updateDistance('left', data.distances.left);
                        updateDistance('right', data.distances.right);
                        hideError();
                    } else {
                        showError(data.error || 'Fehler beim Lesen der Sensoren');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showError('Fehler beim Lesen der Sensoren: ' + error.message);
                });
        }
        
        function updateDistance(sensor, distance) {
            const element = document.getElementById(sensor + 'Distance');
            const threshold = parseInt(document.getElementById('thresholdSlider').value);
            const thresholdIndicator = document.getElementById('thresholdIndicator');
            const thresholdStatus = document.getElementById('thresholdStatus');
            
            if (distance === null || distance === undefined) {
                element.innerHTML = '<span class="distance-error">--</span>';
                thresholdIndicator.className = 'threshold-indicator';
            } else {
                element.innerHTML = distance.toFixed(1);
                
                // Visuelle Warnung basierend auf Schwellenwert
                if (distance < threshold) {
                    thresholdIndicator.className = 'threshold-indicator danger';
                    thresholdStatus.innerHTML = `🔴 HINDERNIS! Distanz (${distance.toFixed(1)}cm) < Schwellenwert (${threshold}cm)`;
                } else if (distance < threshold + 5) {
                    thresholdIndicator.className = 'threshold-indicator warning';
                    thresholdStatus.innerHTML = `🟡 WARNUNG! Distanz (${distance.toFixed(1)}cm) nahe Schwellenwert (${threshold}cm)`;
                } else {
                    thresholdIndicator.className = 'threshold-indicator';
                    thresholdStatus.innerHTML = `🟢 OK - Distanz: ${distance.toFixed(1)}cm | Schwellenwert: ${threshold}cm`;
                }
            }
        }
        
        function updateThresholdDisplay(value) {
            document.getElementById('thresholdDisplay').textContent = value;
            document.getElementById('collisionDistance').value = value;
            // Sofort visuell aktualisieren wenn Sensor-Werte vorhanden
            readSensors();
        }
        
        function loadConfig() {
            fetch('/api/config/get')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const threshold = data.config.collision_distance_cm;
                        document.getElementById('thresholdSlider').value = threshold;
                        document.getElementById('thresholdDisplay').textContent = threshold;
                        document.getElementById('collisionDistance').value = threshold;
                        document.getElementById('minDistance').value = data.config.min_distance_cm;
                    }
                })
                .catch(error => {
                    console.error('Error loading config:', error);
                });
        }
        
        function updateConfig() {
            const threshold = parseInt(document.getElementById('thresholdSlider').value);
            const collisionDistance = parseInt(document.getElementById('collisionDistance').value) || threshold;
            const minDistance = parseInt(document.getElementById('minDistance').value);
            
            fetch('/api/config/update', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    collision_distance_cm: collisionDistance,
                    min_distance_cm: minDistance
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert('Konfiguration erfolgreich gespeichert!\n\nSchwellenwert: ' + threshold + ' cm\n\nRoboter fährt nach rechts, wenn Links-Sensor < ' + threshold + ' cm misst.');
                } else {
                    alert('Fehler: ' + data.error);
                }
            })
            .catch(error => {
                alert('Fehler beim Speichern: ' + error.message);
            });
        }
        
        function startAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
            autoRefreshInterval = setInterval(() => {
                checkSensorStatus();
            }, 1000); // Refresh every second
        }
        
        function stopAutoRefresh() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
                autoRefreshInterval = null;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }
    </script>
</body>
</html>
